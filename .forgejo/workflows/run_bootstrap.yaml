name: Bootstrap

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test_bootstrap:
    runs-on: node
    steps:
      - name: Add homelab cert
        env:
          ROOT_CERT: ${{ vars.HOMELAB_ROOT_CA_CERT }}
        run: |
          apt-get update
          apt-get install ca-certificates
          CERT_LOCATION=/usr/local/share/ca-certificates/homelab_ca.cert.pem
          echo "$ROOT_CERT" >$CERT_LOCATION
          update-ca-certificates
          git config --global http.sslCAInfo $CERT_LOCATION

      - name: Ensure sudo
        run: |
          apt-get update
          apt-get install -y sudo

      - uses: actions/checkout/@v6

      - name: Run bootstrap
        run: ./bootstrap.sh

      - name: Test Alacritty desktop
        run: |
          location=$(grep '^Exec=' /usr/share/applications/alacritty.desktop | cut -d '=' -f2)
          [[ $(command -v $location) ]] && echo Success || exit 1
