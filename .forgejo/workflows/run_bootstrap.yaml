name: Bootstrap

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test_bootstrap:
    runs-on: ci_runner
    steps:
      - name: Ensure sudo
        run: |
          apt-get update
          apt-get install -y sudo

      - uses: actions/checkout/@v6

      - name: Run bootstrap
        run: |
          # Remove the rust installation that's part of the runner image since
          # bootstrap will install its own
          rm -rf $RUSTUP_HOME
          unset CARGO_HOME RUSTUP_HOME

          ./bootstrap.sh

      - name: Test Alacritty desktop
        run: |
          location=$(grep '^Exec=' /usr/share/applications/alacritty.desktop | cut -d '=' -f2)
          [[ $(command -v $location) ]] && echo Success || exit 1
