name: Bootstrap

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  run_bootstrap:
    runs-on: docker
    steps:
      - uses: actions/checkout/@v6
      - run: apt update
      - run: apt install -y sudo
      - run: ./bootstrap.sh
